<div class="projects-wrapper">
  
  <header class="projects-header">
    <h1 class="page-title">Projects</h1>
    <p class="page-description">A chronological overview of my technical work and contributions</p>
  </header>

  <div class="timeline-container">
    <div class="timeline-track"></div>
    
    <div *ngFor="let project of projects; let i = index" class="project-entry">
      <div class="timeline-marker">
        <div class="marker-dot"></div>
      </div>
      
      <div class="project-card">
        <div class="project-header">
          <div class="header-main">
            <h2 class="project-title">{{ project.title }}</h2>
            <p *ngIf="project.role" class="project-role">{{ project.role }}</p>
          </div>
          <span class="project-period">{{ project.period }}</span>
        </div>
        
        <ul class="project-details">
          <li *ngFor="let detail of project.description">{{ detail }}</li>
        </ul>
        
        <div class="tech-tags">
          <span *ngFor="let tech of project.technologies" class="tech-tag">{{ tech }}</span>
        </div>
        
        <div *ngIf="project.github || project.link" class="project-links">
          <a *ngIf="project.github" [href]="project.github" target="_blank" class="project-link">
            View on GitHub →
          </a>
          <a *ngIf="project.link" [href]="project.link" target="_blank" class="project-link">
            Live Demo →
          </a>
        </div>
      </div>
    </div>
  </div>

</div>
